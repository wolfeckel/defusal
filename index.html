<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defusal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* VOICE: tense, tactile, a little playful — a training rig on a workbench.
   IDEA: a defusal training device bolted to a hazard-striped bench; each module has its own little screen saying what to do.
   PICTURE: the device itself — gunmetal casing, red LCD timer, four modules — is the whole first screen.
   COLOUR and TYPE: hazard yellow bench, gunmetal casing, LCD red accent; Barlow Condensed labels, Share Tech Mono readouts.
   LAYOUT: one centred device, phone-first; full-screen menus between levels. */
:root{color-scheme:light dark;
--bg:light-dark(#f2c230,#17150d);--bg2:light-dark(#e5b41f,#211d10);
--ink:light-dark(#161616,#efe9d6);--case:#2c3136;--case2:#3a4046;--edge:#4c545c;--plate:#1e2226;
--paper:light-dark(#ffffff,#24221c);--pink:light-dark(#5c5c5c,#b5ae98);--rule:light-dark(#d9d9d9,#3d3a30);
--red:#ff3b2f;--lcd:#2a0806;--ok:#3ee07a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip;
background-image:repeating-linear-gradient(135deg,transparent 0 46px,rgba(0,0,0,.045) 46px 92px)}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;line-height:1.05;margin:0;text-wrap:balance}
.wrap{max-width:1100px;margin:0 auto;padding:10px 12px 96px}
/* top bar */
.hud{display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto 10px}
.hud h1{flex:1;font-size:24px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ib{all:unset;box-sizing:border-box;cursor:pointer;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--case);color:#eef0f2;font:22px/1 system-ui,sans-serif;box-shadow:0 4px 0 #15181b}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #15181b}.ib:focus-visible{outline:3px solid #fff}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;max-width:520px;margin:0 auto}
.wrap{padding-bottom:24px}
/* device */
.device{background:linear-gradient(160deg,var(--case2),var(--case) 60%);border-radius:22px;padding:16px;position:relative;
box-shadow:0 2px 0 var(--edge) inset,0 -3px 0 #1a1d20 inset,0 24px 40px -18px rgba(0,0,0,.55),0 6px 0 #15181b}
.device.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
.bolt{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8a939b,#3a4046)}
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:stretch;margin:4px 8px 14px}
.lcd{background:var(--lcd);border-radius:10px;padding:6px 16px;font:clamp(40px,7vw,58px)/1 "Share Tech Mono",monospace;color:var(--red);
text-shadow:0 0 12px rgba(255,59,47,.6);box-shadow:inset 0 3px 8px #000;min-width:4.4ch;text-align:center;white-space:nowrap}
.strikes{display:flex;gap:6px;align-items:center;background:var(--plate);border-radius:10px;padding:8px 12px}
.elapsed{justify-self:center;align-self:center;display:flex;flex-direction:column;align-items:center;background:var(--plate);border-radius:10px;padding:6px 14px;color:#9aa2a9;font:13px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.1em}
.elapsed b{font:26px/1.1 "Share Tech Mono",monospace;color:#b8ffd0;letter-spacing:0}
.strikes{flex-direction:column;align-items:center;justify-content:center;gap:0;color:#d6d9dc;font:13px/1.2 "Barlow Condensed",sans-serif}
.strikes b{font:24px/1.1 "Share Tech Mono",monospace;color:#fff}.strikes.bad b{color:var(--red)}
.lcd{position:relative}
.pen{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:700 26px/1 "Share Tech Mono",monospace;color:#fff;background:var(--red);padding:4px 10px;border-radius:8px;
white-space:nowrap;pointer-events:none;z-index:4;animation:pen 1.3s ease-out forwards;text-shadow:none}
@keyframes pen{0%{opacity:0;transform:translate(-50%,-30px) scale(1.6)}15%{opacity:1;transform:translate(-50%,4px) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,24px)}}
.lcd.hit{animation:hit .5s}@keyframes hit{0%,40%{background:#7a0e08}}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mod{background:linear-gradient(#41484f,#353b41);border-radius:14px;padding:14px;min-height:250px;position:relative;
box-shadow:inset 0 1px 0 #5a636c,inset 0 -2px 0 #23272b}
.led{position:absolute;top:14px;right:14px;width:16px;height:16px;border-radius:50%;background:#2b1515;box-shadow:inset 0 2px 3px #000}
.mod.done .led{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.mod.done{outline:2px solid rgba(62,224,122,.35)}
/* wires */
.wires{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.wire{all:unset;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr) 22px;align-items:center;height:28px;border-radius:6px}
.wire:focus-visible{outline:2px solid #fff}
.post{width:16px;height:16px;border-radius:4px;background:#1b1e21;justify-self:center}
.cable{height:10px;border-radius:5px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.3)}
.wire.cut .cable{background-clip:content-box!important;-webkit-mask:linear-gradient(90deg,#000 44%,transparent 44% 56%,#000 56%);mask:linear-gradient(90deg,#000 44%,transparent 44% 56%,#000 56%)}
.wire:hover:not(.cut) .cable{filter:brightness(1.2)}
.wire .n{font:12px "Share Tech Mono",monospace;color:#8d959c;text-align:center}
/* button */
.btnmod{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:14px;align-items:center;min-height:190px}
.big{width:min(170px,100%);aspect-ratio:1;border-radius:50%;justify-self:center;border:0;cursor:pointer;
font:800 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;box-shadow:0 8px 0 rgba(0,0,0,.45),inset 0 -6px 0 rgba(0,0,0,.25),inset 0 4px 0 rgba(255,255,255,.35);transition:transform .06s}
.big:active,.big.down{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 -3px 0 rgba(0,0,0,.25)}
.big:focus-visible{outline:3px solid #fff;outline-offset:4px}
/* keypad */
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:230px;margin:6px auto 0}
.key{aspect-ratio:1;border:0;border-radius:10px;background:#e9e4d4;color:#1a1a1a;font:36px/1 "Times New Roman",serif;cursor:pointer;position:relative;
box-shadow:0 5px 0 #8f8a7a;min-height:44px}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #8f8a7a}
.key.hit::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.key:focus-visible{outline:3px solid #fff}
/* pulse */
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:200px;margin:6px auto 0;transform:rotate(45deg) scale(.86)}
.pad{aspect-ratio:1;border:0;border-radius:12px;cursor:pointer;opacity:.42;transition:opacity .08s,filter .08s;min-height:44px}
.pad.lit{opacity:1;filter:brightness(1.35) drop-shadow(0 0 12px currentColor)}
.pad:focus-visible{outline:3px solid #fff}
/* overlay */
.over{position:absolute;inset:0;border-radius:22px;background:rgba(18,20,22,.9);display:flex;align-items:center;justify-content:center;
text-align:center;padding:24px;color:#eef0f2;z-index:5}
.over[hidden]{display:none}
.over.lost{z-index:60;background:rgba(14,10,8,.62);text-shadow:0 2px 12px #000}.over.lost h2{color:#ff6a3d}
.over h2{font-size:clamp(36px,6vw,52px);font-weight:800;margin-bottom:8px}
.over p{margin:0 auto 18px;max-width:40ch;color:#c6cbd0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cta{font:700 18px "Barlow Condensed",sans-serif;padding:12px 22px;min-height:44px;border-radius:10px;border:0;cursor:pointer;background:#f2c230;color:#161616}
.cta.alt{background:#3a4046;color:#eef0f2}
.cta[aria-pressed=true]{outline:3px solid #fff;outline-offset:2px}
.cta:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* explosion */
#fx,#crack{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#fx{z-index:50}#crack{z-index:53;transition:opacity 2.5s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:52}
#flash.go{animation:flash 1.3s ease-out}
@keyframes flash{0%{opacity:1;background:#fff}10%{opacity:1;background:#fff6d8}25%{opacity:.85;background:#ffb030}100%{opacity:0;background:#ff3a10}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:49;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,.55))}
#vig.alarm{animation:alarm .22s infinite alternate}
@keyframes alarm{from{opacity:.15}to{opacity:1}}
.lcd.panic{animation:panic .12s infinite alternate}
@keyframes panic{from{color:#ff3b2f}to{color:#fff;text-shadow:0 0 30px #ff3b2f}}
.device.rattle{animation:rattle .08s infinite}
@keyframes rattle{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
body.quake .wrap{animation:quake 1.4s cubic-bezier(.36,.07,.19,.97)}
@keyframes quake{4%{transform:translate(-30px,18px) rotate(-1.5deg) scale(1.03)}10%{transform:translate(26px,-22px) rotate(1.4deg) scale(1.02)}18%{transform:translate(-22px,14px) rotate(-1deg)}28%{transform:translate(18px,-10px) rotate(.6deg)}40%{transform:translate(-12px,8px)}55%{transform:translate(8px,-5px)}70%{transform:translate(-4px,3px)}85%{transform:translate(2px,-1px)}}
.mod.fly{transition:transform 1.6s cubic-bezier(.12,.75,.3,1),opacity 1.6s ease-in;opacity:0;pointer-events:none}
.device.blown{background:linear-gradient(160deg,#1d1a17,#0d0b09 60%);box-shadow:inset 0 0 60px #000,0 24px 40px -18px rgba(0,0,0,.55)}
.device.blown .top{filter:sepia(.7) brightness(.4) contrast(1.3);transition:filter .3s}
.device.blown .lcd{animation:none;color:#5a1510;text-shadow:none}
/* final lock */
.mods[hidden],.vault[hidden]{display:none}
.mods.lift{transform-origin:50% 0;animation:lift .9s cubic-bezier(.5,0,.75,0) forwards}
@keyframes lift{0%{transform:perspective(1000px) rotateX(0)}20%{transform:perspective(1000px) rotateX(8deg)}100%{transform:perspective(1000px) rotateX(-88deg) translateY(-30px);opacity:0}}
.vault{min-height:520px;display:flex;flex-direction:column;}.vault .vgrid{flex:1;align-content:center}.vault{animation:rise .6s ease-out;background:radial-gradient(circle at 50% 0,#4a5259,#2e3338 70%)}
@keyframes rise{from{opacity:0;transform:scale(.96)}}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:560px){.vgrid{grid-template-columns:minmax(0,1fr)}}
.vdisp{background:#0b170e;color:#46ff8a;font:clamp(32px,5vw,44px)/1.2 "Share Tech Mono",monospace;letter-spacing:.35em;text-indent:.35em;text-align:center;border-radius:8px;padding:10px;
box-shadow:inset 0 3px 8px #000;text-shadow:0 0 10px rgba(70,255,138,.5);white-space:nowrap}
.vdisp.err{color:var(--red);text-shadow:0 0 10px rgba(255,59,47,.6)}
.vdisp.ok{background:#0e3a1d;color:#b8ffd0}
.pinpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.pin{min-height:52px;border:0;border-radius:8px;background:#1f2327;color:#e8eaec;font:24px "Share Tech Mono",monospace;box-shadow:0 4px 0 #0d0f11,inset 0 1px 0 #3a4046;cursor:pointer}
.pin:active{transform:translateY(3px);box-shadow:0 1px 0 #0d0f11}
.pin:focus-visible{outline:2px solid #fff}
.pin.fn{font:700 17px "Barlow Condensed",sans-serif;background:#5b2620}.pin.ent{background:#1f5134}
.maint{background:#23272b;border-radius:10px;padding:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.hwrap{position:relative;min-height:200px}
.hwrap .wires{padding:8px 0}
.wire.spark .cable{animation:spark .45s}
@keyframes spark{0%,100%{filter:none}20%{filter:brightness(4) drop-shadow(0 0 8px #fff)}50%{filter:brightness(.5)}70%{filter:brightness(3) drop-shadow(0 0 6px #ffd36b)}}
.plate{position:absolute;inset:0;border-radius:8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px),linear-gradient(145deg,#79828a,#4d545a);
box-shadow:inset 0 1px 0 #a0a8b0,0 6px 14px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:2;
transition:transform .8s cubic-bezier(.5,0,.8,.4),opacity .8s}
.plate.off{transform:translate(30px,320px) rotate(28deg);opacity:0;pointer-events:none}
.warn{font:700 15px/1.2 "Barlow Condensed",sans-serif;color:#1d2125;border:2px solid #1d2125;padding:6px 10px;border-radius:4px;text-align:center;max-width:70%}
.screw{position:absolute;width:44px;height:44px;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.screw::before{content:"";width:20px;height:20px;border-radius:50%;background:linear-gradient(45deg,transparent 44%,#2a2f34 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#2a2f34 44% 56%,transparent 56%),radial-gradient(circle at 35% 35%,#d9dee2,#7b838a);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.screw:hover::before{filter:brightness(1.15)}.screw:focus-visible{outline:2px solid #fff;border-radius:50%}
.screw.out{animation:unscrew .6s forwards;pointer-events:none}
@keyframes unscrew{60%{transform:rotate(-900deg) scale(1.3);opacity:1}100%{transform:rotate(-1080deg) scale(1.5) translateY(-20px);opacity:0}}
/* levels */
.mod[hidden]{display:none}
.mods.one{grid-template-columns:minmax(0,1fr);max-width:440px;margin:0 auto}
.mod.done{animation:okp .7s ease-out}
@keyframes okp{0%{box-shadow:0 0 0 0 rgba(62,224,122,.85)}100%{box-shadow:0 0 0 22px rgba(62,224,122,0)}}
.lcd.safe{color:var(--ok);text-shadow:0 0 14px rgba(62,224,122,.7)}
.kicker{font:700 15px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#f2c230;margin-bottom:6px}
.stars{font-size:46px;line-height:1;letter-spacing:.08em;color:#f2c230;text-shadow:0 0 18px rgba(242,194,48,.6);margin:2px 0 10px}
.stars span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.7,.4,1) backwards}
.stars i{font-style:normal;color:#4c545c;text-shadow:none}
@keyframes pop{from{transform:scale(0) rotate(-120deg);opacity:0}}
.name{font:600 20px Barlow,sans-serif;padding:10px 14px;min-height:48px;width:min(320px,100%);border-radius:10px;border:2px solid #4c545c;background:#15181b;color:#fff;text-align:center}
.name:focus-visible{outline:3px solid #f2c230;outline-offset:2px}
.lvls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:470px;margin:0 auto 16px}
.lv{width:38px;height:38px;border:0;border-radius:8px;background:#3a4046;color:#eef0f2;font:16px "Share Tech Mono",monospace;cursor:pointer}
.lv.won{background:#1f5134}.lv.cur{outline:3px solid #f2c230;outline-offset:1px}
.lv:disabled{opacity:.3;cursor:default}.lv:focus-visible{outline:3px solid #fff}
.link{display:block;margin:12px auto 0;background:none;border:0;color:#9aa2a9;text-decoration:underline;cursor:pointer;font:14px Barlow,sans-serif;min-height:32px}
/* ===== mobile-game layout ===== */
.mods{gap:10px}
.mod{min-height:0;padding:12px}
.btnmod{grid-template-columns:minmax(0,1fr) 26px;gap:10px;min-height:0}
.big{width:min(150px,100%)}
.keys{gap:8px;max-width:190px}.key{font-size:clamp(26px,7vw,34px)}
.pads{max-width:170px}
.device{padding:12px}
/* full-screen menus */
.over{position:fixed;inset:0;z-index:40;border-radius:0;padding:24px 18px calc(24px + env(safe-area-inset-bottom));overflow:auto;
background:radial-gradient(circle at 50% 28%,#3e454c,#16191c 72%)}
.over>div{width:min(400px,100%);margin:auto}
.over.lost{background:rgba(14,10,8,.6)}
.over h2{font-size:clamp(40px,11vw,56px)}
.over h2:empty,.over p:empty{display:none}
.over p{font-size:18px;margin-bottom:20px}
.over .row{flex-direction:column;align-items:stretch;gap:12px}
.cta{font:800 24px "Barlow Condensed",sans-serif;letter-spacing:.06em;min-height:64px;border-radius:18px;box-shadow:0 6px 0 #a8820f}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #a8820f}
.cta.alt{font-size:19px;min-height:52px;box-shadow:0 5px 0 #1b1e21}
.logo{font:clamp(56px,17vw,84px)/1 "Share Tech Mono",monospace;color:var(--red);text-shadow:0 0 24px rgba(255,59,47,.7);background:var(--lcd);
border-radius:16px;padding:14px 10px;box-shadow:inset 0 4px 12px #000;margin-bottom:28px;letter-spacing:.04em}
.kicker{font-size:17px}
.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 24px}
.chips:empty{display:none}
.chip{background:rgba(0,0,0,.35);border-radius:999px;padding:8px 16px;font:22px/1 "Share Tech Mono",monospace;color:#fff}
.chip.hot{background:#f2c230;color:#161616;font:800 18px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.06em}
.name{font-size:24px;min-height:60px;border-radius:16px;width:100%}
.lvls[hidden],.row[hidden],.link[hidden]{display:none}
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:none;margin:0 0 20px}
.lv{width:auto;height:auto;aspect-ratio:1;border-radius:16px;font:24px/1 "Share Tech Mono",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 0 #1b1e21}
.lv small{font:12px/1 system-ui,sans-serif;color:#f2c230;letter-spacing:-.05em}
.link{font-size:16px}
/* on-module instruction screens */
.clue{background:#0b170e;color:#46ff8a;font:700 18px/1.15 "Share Tech Mono",monospace;text-shadow:0 0 8px rgba(70,255,138,.5);border-radius:8px;padding:6px 10px;
margin:0 26px 10px 0;min-height:44px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;text-align:center;box-shadow:inset 0 2px 6px #000}
.clue small{font-size:13px;opacity:.7}
.mod.done .clue{color:#b8ffd0}
.clue.hint{animation:hint 1s ease-in-out 5}
@keyframes hint{50%{box-shadow:inset 0 2px 6px #000,0 0 0 3px #f2c230,0 0 20px #f2c230}}
.cp{display:inline-block;padding:2px 8px;border-radius:5px;font:800 16px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-shadow:none;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.sq{display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:6px;background:rgba(70,255,138,.12);font:24px/1 "Times New Roman",serif}
.sq.ok{background:#1f5134;color:#b8ffd0}
.keys.six{grid-template-columns:repeat(3,minmax(0,1fr));max-width:240px}
.key.bad{animation:bad .4s}@keyframes bad{30%{background:#ff6a5f;transform:translateX(-3px)}70%{transform:translateX(3px)}}
.meter{position:relative;height:min(150px,36vw);border-radius:8px;background:#1b1e21;box-shadow:inset 0 2px 6px #000;overflow:hidden}
.zone{position:absolute;left:0;right:0;background:rgba(62,224,122,.3);border-block:2px solid var(--ok)}
.fill{position:absolute;left:4px;right:4px;bottom:0;height:0;border-radius:4px;background:linear-gradient(#fff,#f2c230);opacity:.9}
.btnmod.nometer{grid-template-columns:minmax(0,1fr)}.btnmod.nometer .meter{display:none}
.vault{min-height:0}
.codebig{position:absolute;inset:0;display:grid;place-items:center;border-radius:8px;background:#0b170e;color:#46ff8a;font:clamp(36px,10vw,50px)/1 "Share Tech Mono",monospace;
letter-spacing:.2em;text-indent:.2em;text-shadow:0 0 12px rgba(70,255,138,.6);box-shadow:inset 0 3px 8px #000}
.codebig.gone{color:#2f5a3c;text-shadow:none}
.hwrap{min-height:170px}
/* switches */
.sws{display:flex;justify-content:center;gap:8px;padding:6px 0}
.sw2{position:relative;width:36px;height:84px;padding:0;border:0;border-radius:18px;background:#1b1e21;box-shadow:inset 0 3px 8px #000;cursor:pointer}
.sw2 .knob{position:absolute;left:4px;right:4px;bottom:4px;height:36px;border-radius:14px;background:linear-gradient(#e9e4d4,#a9a395);box-shadow:0 3px 0 #6d685c;transition:bottom .12s}
.sw2.up .knob{bottom:44px}

<script>
{
const $=s=>document.querySelector(s);
const COL={red:'#e8382e',blue:'#2f6fe0',yellow:'#f2c230',white:'#eeeeee',black:'#141414',green:'#2fb85a'};
// all puzzle randomness goes through RNG, so the Daily bomb can use a seeded one and be the same for everyone
let RNG=Math.random;
const rnd=n=>Math.floor(RNG()*n), pick=a=>a[rnd(a.length)];
const mulberry=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const seedOf=str=>{let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const cap=s=>s[0].toUpperCase()+s.slice(1);

/* ---------- sound ---------- */
let ac=null,master=null;
const beep=(f,d=.08,type='square',v=.05)=>{if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;
g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(master);o.start();o.stop(ac.currentTime+d)}catch(e){}};
// one master volume so the mute button silences everything
function audioOn(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}   // iPhone: play even with the silent switch on
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination)}catch(e){ac=null;return}}
  try{ac.resume&&ac.resume()}catch(e){}
  master.gain.value=S.muted?0:1;
}
// named sound effects, all synthesised (no audio files)
const SFX={
  snip(){if(!ac)return;try{noiseBurst(ac.currentTime,.06,9000,3000,.35,1)}catch(e){}beep(2200,.03,'triangle',.05)},
  thunk(){if(!ac)return;beep(140,.09,'sine',.25);try{noiseBurst(ac.currentTime,.03,1500,400,.15,1)}catch(e){}},
  click(f=1800){if(!ac)return;beep(f,.015,'square',.05);try{noiseBurst(ac.currentTime,.012,8000,4000,.1,1)}catch(e){}},
  key(n){if(!ac)return;try{noiseBurst(ac.currentTime,.02,6000,2000,.22,1)}catch(e){}beep(900+n*120,.05,'triangle',.06)},
  clack(up){if(!ac)return;try{noiseBurst(ac.currentTime,.025,5000,1500,.3,1)}catch(e){}beep(up?900:650,.03,'square',.05)},
  ratchet(v=.18){if(!ac)return;try{noiseBurst(ac.currentTime,.012,7000,3000,v,1)}catch(e){}beep(1500,.01,'square',.03)},
  blip(f){beep(f,.09,'sine',.09);beep(f*2,.05,'sine',.03)},
  step(){beep(700,.06,'sine',.07);setTimeout(()=>beep(1050,.06,'sine',.06),60)},
  heart(){beep(55,.12,'sine',.35);setTimeout(()=>beep(48,.12,'sine',.28),150)},
  arm(){if(!ac)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(900,t+.3);
    g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g).connect(master);o.start(t);o.stop(t+.36)}catch(e){}setTimeout(()=>beep(1200,.08,'square',.05),320)}
};
// the button hum: rises with the meter while you hold
let hum=null;
function holdHum(on){
  if(!ac)return;
  if(on&&!hum){try{const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=160;f.type='lowpass';f.frequency.value=1400;g.gain.value=.035;
    o.connect(f).connect(g).connect(master);o.start();hum={o,g}}catch(e){}}
  if(!on&&hum){try{hum.g.gain.setTargetAtTime(0,ac.currentTime,.02);hum.o.stop(ac.currentTime+.15)}catch(e){}hum=null}
}

/* ---------- shared data ---------- */
const SYMS=['Ω','ζ','¶','★','Ж','‡','λ','∞','Ψ','☾','¿','©','ξ','Φ','∂','Δ','¥','Б','☼','Ѣ','¤','∇','§','Я','≈'];
const PC=['red','blue','green','yellow'];
let PENALTY=10000;

/* ---------- levels: each one adds a little more ---------- */
// wires {n:[min,max], clues, cuts} · button {kinds, zone %, speed s, slide s} · keys {n, len, memo ms, rev chance}

// level extras: final {len, memo} · hide (ms before every instruction screen goes blank) · sd (sudden death) · boss
// slider {n sliders, move ms} · level extras also: decoy {late ms} · chain {blind ms} · shuffle 'mods'|'all'

const W=(n,clues,cuts=1)=>({n,clues,cuts}), B=(kinds,zone=30,speed=2,slide=0)=>({kinds,zone,speed,slide}),
  K=(n,len,memo=0,rev=0)=>({n,len,memo,rev}), P=(taps,rev=0)=>({taps,rev}),

const WALL=['color','num','ord','odd'], W2=[...WALL,'all'], BALL=['tap','taps','hold'];
const LV=(t,time,pen,mods,intro,final,x={})=>({t,time,pen,mods,intro,final,...x});
const LEVELS=[
 // ── World 1 · Training (gentle: lots of time, small penalties)
 LV('First cut',60,3,{wires:W([3,3],['color'])},'Cut the wire the screen shows.'),
 LV('By number',60,3,{wires:W([4,4],['num'])},'Wires are numbered.'),
 LV('Which one?',60,3,{wires:W([4,5],['ord'])},'Count from the top.'),
 LV('Odd one out',60,3,{wires:W([5,6],['odd'])},'Spot the different one.'),
 LV('Double cut',60,5,{wires:W([5,6],['color','num','ord'],2)},'Two cuts, in order.'),
 LV('Push',60,3,{button:B(['tap','taps'])},'New: the Button.'),
 LV('Hold it',60,3,{button:B(['hold'],40,2.6)},'Hold, let go in the green.'),
 LV('Tap or hold',60,5,{button:B(BALL,34,2.2)},'Do what the screen says.'),
 LV('Two at once',90,5,{wires:W([4,6],WALL),button:B(BALL,34,2.2)},'Two modules.'),
 LV('Keypad',60,3,{keys:K(4,3)},'New: the Keypad.'),
 LV('Four in a row',60,3,{keys:K(4,4)},'Four symbols.'),
 LV('Six keys',60,5,{keys:K(6,4)},'More keys.'),
 LV('Remember',60,5,{keys:K(4,4,3500)},'Memorise it. It vanishes.'),
 LV('Cut and key',90,5,{wires:W([4,6],WALL,2),keys:K(6,4)},'Wires + Keypad.'),
 LV('Whack',60,3,{pulse:P(4)},'New: Pulse. Tap the lit pad.'),
 LV('Reflex',60,3,{pulse:P(5)},'More taps.'),
 LV('Quick hands',60,5,{pulse:P(6)},'Faster now.'),
 LV('Three modules',120,8,{wires:W([4,6],WALL,2),button:B(BALL,30,2),keys:K(6,4)},'Three modules.'),
 LV('Full rig',150,8,{wires:W([4,6],WALL,2),button:B(BALL,30,2),keys:K(6,4),pulse:P(5)},'All four.'),
 LV('Final lock',180,8,{wires:W([4,6],WALL,2),button:B(BALL,30,2),keys:K(6,4),pulse:P(5)},'New: the Final lock.',{memo:0}),
 LV('Quick fingers',150,8,{wires:W([4,6],WALL,2),button:B(BALL,26,1.8),keys:K(6,4),pulse:P(6)},'Less time.',{memo:0}),
 LV('Triple cut',150,10,{wires:W([5,7],WALL,3),button:B(BALL,26,1.8),keys:K(6,4),pulse:P(6)},'Three cuts.',{memo:0}),

function wireClue(w,cut,type){

  if(type==='ord'){const cs=cols.filter(c=>idx(c).length>=2&&idx(c).some(live));if(!cs.length)return null;const c=pick(cs),p=idx(c),k=pick(p.map((_,k)=>k).filter(k=>live(p[k])));
    return{html:`CUT ${k===p.length-1?'LAST':ORD[k]} ${cp(c)}`,ans:[p[k]]}}
  if(type==='odd'){if(cut.size||w.length<3||cols.length!==2)return null;const c=cols.find(c=>idx(c).length===1);return c?{html:'CUT THE ODD ONE',ans:idx(c)}:null}
  if(type==='all'){const cs=cols.filter(c=>idx(c).length>=2&&idx(c).every(live));if(!cs.length)return null;const c=pick(cs);return{html:`CUT ALL ${cp(c)}`,ans:idx(c)}}

function makeWires(cfg){

    const n=cfg.n[0]+rnd(cfg.n[1]-cfg.n[0]+1);let w;
    if(cfg.clues.includes('odd')&&(cfg.clues.length===1||RNG()<.2)){const a=pick(cols),b=pick(cols.filter(x=>x!==a));w=Array(n).fill(a);w[rnd(n)]=b}

    for(let k=0;k<cfg.cuts;k++){const s=shuffle(cfg.clues.filter(t=>t!=='not'||k===cfg.cuts-1)).map(t=>wireClue(w,cut,t)).find(Boolean);if(!s)break;steps.push(s);s.ans.forEach(i=>cut.add(i))}

  }

// pre-rendered soft sprites
function sprite(stops){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
  stops.forEach(([o,col])=>g.addColorStop(o,col));x.fillStyle=g;x.fillRect(0,0,128,128);return c}
const SPR={
  hot:sprite([[0,'rgba(255,255,245,1)'],[.25,'rgba(255,240,170,.9)'],[1,'rgba(255,200,80,0)']]),

/* sound */
function noiseBurst(t,dur,f0,f1,vol,shape=2.2){
  const len=ac.sampleRate*dur,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,shape);
  const s=ac.createBufferSource();s.buffer=buf;const lp=ac.createBiquadFilter();lp.type='lowpass';
  lp.frequency.setValueAtTime(f0,t);lp.frequency.exponentialRampToValueAtTime(f1,t+dur*.8);
  const g=ac.createGain();g.gain.value=vol;s.connect(lp).connect(g).connect(master);s.start(t);
}
function boom(scale=1,delay=0){
  if(!ac)return;try{
    const t=ac.currentTime+delay;
    noiseBurst(t,2.8*scale,5000,90,1*scale);
    const o=ac.createOscillator(),ws=ac.createWaveShaper(),og=ac.createGain(),curve=new Float32Array(256);
    for(let i=0;i<256;i++){const x=i/128-1;curve[i]=Math.tanh(x*4)}ws.curve=curve;
    o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(24,t+1.4*scale);
    og.gain.setValueAtTime(.9*scale,t);og.gain.exponentialRampToValueAtTime(.001,t+1.8*scale);
    o.connect(ws).connect(og).connect(master);o.start(t);o.stop(t+2);
  }catch(e){}
}
function debrisSound(){if(!ac)return;try{for(let i=0;i<14;i++){const t=ac.currentTime+.4+Math.random()*1.8;noiseBurst(t,.06+Math.random()*.08,9000,2500,.12+Math.random()*.15,1.5)}}catch(e){}}
function crackle(){if(!ac||!FX.burn)return;try{const t=ac.currentTime;for(let i=0;i<4;i++)noiseBurst(t+Math.random()*.4,.02,6000,1500,.05*Math.random(),1)}catch(e){}later(300+Math.random()*400,crackle)}

/* screen cracks */
function cracks(cx,cy){
  const cv=$('#crack'),x=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);cv.style.opacity=1;
  const line=(x0,y0,a,len,w,depth)=>{
    let px=x0,py=y0;x.beginPath();x.moveTo(px,py);
    const steps=8+rnd(8);for(let i=0;i<steps;i++){a+=(Math.random()-.5)*.5;px+=Math.cos(a)*len/steps;py+=Math.sin(a)*len/steps;x.lineTo(px,py);
      if(depth<2&&Math.random()<.18)FX.br.push([px,py,a+(Math.random()-.5)*1.6,len*.4,w*.6,depth+1])}
    x.lineWidth=w+2;x.strokeStyle='rgba(0,0,0,.35)';x.stroke();x.lineWidth=w;x.strokeStyle='rgba(255,255,255,.8)';x.stroke();
  };
  FX.br=[];const n=12+rnd(6),R=Math.hypot(W,H);
  for(let i=0;i<n;i++)line(cx,cy,i/n*6.283+Math.random()*.3,R*(.35+Math.random()*.5),1.6,0);
  while(FX.br.length)line(...FX.br.shift());
  for(let ring=1;ring<=3;ring++){const r=ring*(40+Math.random()*30);x.beginPath();
    for(let a=0;a<=6.3;a+=.25){const rr=r+(Math.random()-.5)*14;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}
    x.lineWidth=1;x.strokeStyle='rgba(255,255,255,.55)';x.stroke()}
  const g=x.createRadialGradient(cx,cy,0,cx,cy,70);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(cx-70,cy-70,140,140);
  later(3500,()=>cv.style.opacity=.3);
}

/* particles */
function blast(cx,cy,power){
  const P=FX.P,big=Math.max(innerWidth,innerHeight);
  FX.rings.push({x:cx,y:cy,r:10,v:big*.04*power,a:1,w:40*power,flat:1},{x:cx,y:cy,r:0,v:big*.028*power,a:.8,w:18*power,flat:1},{x:cx,y:cy+40,r:0,v:big*.03*power,a:.6,w:30*power,flat:.28});
  const add=(n,f)=>{for(let i=0;i<n*power;i++)P.push(f())};
  add(140,()=>{const a=Math.random()*6.283,s=(3+Math.random()*13)*power;return{k:'fire',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s*.8,r:(30+Math.random()*70)*power,life:0,max:50+Math.random()*40}});
  add(220,()=>{const a=Math.random()*6.283,s=(10+Math.random()*30)*power;return{k:'spark',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:30+Math.random()*50}});
  add(60,()=>{const a=Math.random()*6.283,s=(6+Math.random()*20)*power;return{k:'chunk',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-8,rot:Math.random()*6,vr:(Math.random()-.5)*.6,sz:4+Math.random()*16,c:pick(['#2c3136','#4c545c','#1b1e21','#e8382e','#2f6fe0','#f2c230','#e9e4d4']),trail:Math.random()<.4,life:0,max:140}});
  add(40,()=>{const a=Math.random()*6.283;return{k:'dust',x:cx+Math.cos(a)*30,y:cy+60,vx:Math.cos(a)*(6+Math.random()*10),vy:-Math.random()*1.5,r:40+Math.random()*40,life:0,max:120+Math.random()*60}});
}
function mushroom(cx,cy){
  const P=FX.P,top=Math.max(60,cy-innerHeight*.42);
  for(let i=0;i<110;i++){const d=Math.random()*40;P.push({k:'plume',x:cx+(Math.random()-.5)*50,y:cy,vx:(Math.random()-.5)*1.5,vy:-(5+Math.random()*7),r:40+Math.random()*50,top:top+(Math.random()-.5)*60,life:-d,max:220+Math.random()*120,hot:Math.random()<.55})}
}
function burnAt(){
  const r=$('#device').getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
  for(let i=0;i<3;i++){const x=r.left+20+Math.random()*(r.width-40),y=r.top+r.height*(.8+Math.random()*.18);
    FX.P.push({k:'flame',x,y,vx:(Math.random()-.5)*.6,vy:-(1.5+Math.random()*2.5),r:14+Math.random()*26,life:0,max:30+Math.random()*30})}
  if(Math.random()<.35)FX.P.push({k:'smoke',x:r.left+Math.random()*r.width,y:r.top+r.height*.85,vx:(Math.random()-.5),vy:-(1+Math.random()*1.5),r:20+Math.random()*20,life:0,max:110})
  if(Math.random()<.5)FX.P.push({k:'emb',x:r.left+Math.random()*r.width,y:r.top+r.height*(.3+Math.random()*.6),vx:(Math.random()-.5)*2,vy:-(1+Math.random()*3),life:0,max:90+Math.random()*80,ph:Math.random()*6})
}
function runFX(){
  if(FX.raf)return;
  const cv=$('#fx'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
  const size=()=>{cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();
  const draw=(img,x,y,r,a)=>{ctx.globalAlpha=Math.max(0,Math.min(1,a));ctx.drawImage(img,x-r,y-r,r*2,r*2)};
  (function tick(){
    FX.frame++;const W=innerWidth,H=innerHeight;if(cv.width!==W*dpr||cv.height!==H*dpr)size();
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);
    if(FX.burn&&FX.frame%2===0)burnAt();
    const P=FX.P;
    // smoke & dust first (beneath fire)
    for(const p of P){if(p.life<0)continue;const t=p.life/p.max;
      if(p.k==='smoke'||p.k==='dust'||(p.k==='plume'&&t>.25)){draw(p.k==='dust'?SPR.dust:SPR.smoke,p.x,p.y,p.r*(p.k==='plume'?1.25:1),Math.sin(Math.PI*Math.min(1,t*1.15))*(p.k==='plume'?.9:.7))}}
    ctx.globalCompositeOperation='lighter';
    // shockwaves
    for(const g of FX.rings){g.r+=g.v;g.v*=.965;g.a*=.935;if(g.a<.02)continue;ctx.globalAlpha=1;
      ctx.strokeStyle=`rgba(255,235,200,${g.a})`;ctx.lineWidth=Math.max(1,g.w*g.a);ctx.beginPath();ctx.ellipse(g.x,g.y,g.r,g.r*g.flat,0,0,6.283);ctx.stroke()}
    FX.rings=FX.rings.filter(g=>g.a>=.02);
    for(const p of P){
      p.life++;if(p.life<0)continue;const t=p.life/p.max;
      switch(p.k){
      case 'fire':p.x+=p.vx;p.y+=p.vy;p.vx*=.92;p.vy=p.vy*.92-.22;p.r*=1.012;
        draw(t<.18?SPR.hot:t<.5?SPR.fire:SPR.ember,p.x,p.y,p.r,(1-t)*1.1);break;
      case 'plume':{p.x+=p.vx;p.y+=p.vy;
        if(p.y<p.top){p.vy*=.86;if(!p.spread){p.spread=1;p.vx=(Math.random()-.5)*9}p.vx*=.97;p.r+=.9}else{p.vy*=.995;p.r+=.25}
        if(t<.35)draw(p.hot&&t<.12?SPR.hot:SPR.fire,p.x,p.y,p.r*.8,(.35-t)*3*(p.hot?1:.6));break}
      case 'spark':{const ox=p.x,oy=p.y;p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy=p.vy*.95+.4;ctx.globalAlpha=1-t;
        ctx.strokeStyle=`rgb(255,${230-t*140|0},${120-t*100|0})`;ctx.lineWidth=2.4*(1-t)+.6;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(p.x,p.y);ctx.stroke();break}
      case 'chunk':p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy+=.5;p.rot+=p.vr;
        if(p.trail&&t<.6)draw(SPR.fire,p.x,p.y,10+p.sz,(.6-t)*1.4);
        ctx.globalCompositeOperation='source-over';ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=t>.85?(1-t)*6:1;
        ctx.fillStyle=p.c;ctx.fillRect(-p.sz/2,-p.sz/3,p.sz,p.sz*.66);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-p.sz/2,p.sz/8,p.sz,p.sz*.2);ctx.restore();ctx.globalCompositeOperation='lighter';break;
      case 'flame':p.x+=p.vx+Math.sin((p.life+p.y)*.2)*.4;p.y+=p.vy;p.r*=.975;draw(t<.25?SPR.hot:t<.6?SPR.fire:SPR.ember,p.x,p.y,p.r,(1-t)*.9);break;
      case 'emb':p.x+=p.vx+Math.sin(p.life*.1+p.ph)*.6;p.y+=p.vy;p.vy*=.99;ctx.globalAlpha=(1-t)*(.6+.4*Math.sin(p.life*.5));ctx.fillStyle='#ffb347';ctx.fillRect(p.x,p.y,2.5,2.5);break;
      case 'conf':p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.32;p.rot+=p.vr;
        ctx.globalCompositeOperation='source-over';ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=t>.8?(1-t)*5:1;
        ctx.fillStyle=p.c;ctx.fillRect(-p.sz/2,-p.sz/4*Math.abs(Math.cos(p.life*.15+p.rot)),p.sz,p.sz/2*Math.abs(Math.cos(p.life*.15+p.rot))+1);ctx.restore();ctx.globalCompositeOperation='lighter';break;
      case 'smoke':case 'dust':p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy=p.k==='dust'?p.vy*.96:p.vy*.99-.01;p.r+=p.k==='dust'?1.2:.6;break;
      }
    }
    // core glow in first frames
    if(FX.glow>0){const a=FX.glow,gr=ctx.createRadialGradient(FX.cx,FX.cy,0,FX.cx,FX.cy,200+(1-a)*600);
      gr.addColorStop(0,`rgba(255,255,230,${a})`);gr.addColorStop(.3,`rgba(255,170,50,${a*.75})`);gr.addColorStop(1,'rgba(255,50,10,0)');ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);FX.glow-=.02}
    FX.P=P.filter(p=>p.life<p.max);
    if(FX.P.length>1600)FX.P.splice(0,FX.P.length-1600);
    if(FX.P.length||FX.rings.length||FX.burn)FX.raf=requestAnimationFrame(tick);else{ctx.clearRect(0,0,W,H);FX.raf=0}
  })();
}
// win burst: confetti in the casing colours, fired up out of the device
function celebrate(){
  if(RM())return;
  const r=$('#device').getBoundingClientRect(),cx=Math.min(Math.max(r.left+r.width/2,40),innerWidth-40),cy=Math.min(Math.max(r.top+r.height*.3,40),innerHeight-40);
  FX.rings.push({x:cx,y:cy,r:10,v:26,a:.35,w:6,flat:1});
  for(let i=0;i<170;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,s=8+Math.random()*15;
    FX.P.push({k:'conf',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:Math.random()*6,vr:(Math.random()-.5)*.4,sz:7+Math.random()*7,c:pick(['#3ee07a','#f2c230','#eeeeee','#2f6fe0','#e8382e']),life:0,max:130+Math.random()*70})}
  runFX();
}
function resetFX(){
  FX.timers.forEach(clearTimeout);FX.timers=[];FX.burn=false;FX.P=[];FX.rings=[];FX.glow=0;
  cancelAnimationFrame(FX.raf);FX.raf=0;
  for(const id of ['#fx','#crack']){const c=$(id);c.getContext('2d').clearRect(0,0,c.width,c.height)}
  $('#vig').classList.remove('alarm');$('#clock').classList.remove('panic');
  const d=$('#device');d.classList.remove('blown','rattle');
  document.querySelectorAll('.mod').forEach(m=>{m.classList.remove('fly');m.style.transform=''});
}
function explode(onDone){
  const dev=$('#device'),clock=$('#clock'),vig=$('#vig');
  // 1. panic: accelerating beeps, flashing LCD, red pulse
  clock.classList.add('panic');vig.classList.add('alarm');dev.classList.add('rattle');
  let gap=220,t=0;while(t<1100){const f=900+t;later(t,()=>beep(f,.05,'square',.06));t+=gap;gap=Math.max(45,gap*.78)}
  // 2. detonation
  later(1200,()=>{
    clock.classList.remove('panic');vig.classList.remove('alarm');dev.classList.remove('rattle');
    boom(1);boom(.55,.35);boom(.45,.75);debrisSound();
    const fl=$('#flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
    dev.classList.add('blown');
    document.body.classList.remove('quake');void document.body.offsetWidth;document.body.classList.add('quake');
    if(RM()){later(1500,onDone);return}
    const r=dev.getBoundingClientRect(),cx=Math.min(Math.max(r.left+r.width/2,40),innerWidth-40),cy=Math.min(Math.max(r.top+r.height/2,40),innerHeight-40);
    FX.cx=cx;FX.cy=cy;FX.glow=1;
    // modules torn off the casing
    document.querySelectorAll('.mod').forEach(m=>{const mr=m.getBoundingClientRect(),dx=mr.left+mr.width/2-cx,dy=mr.top+mr.height/2-cy,l=Math.hypot(dx,dy)||1,f=700+Math.random()*700;
      m.style.transform=`translate(${dx/l*f}px,${dy/l*f-200}px) rotate(${(Math.random()-.5)*720}deg) scale(.6)`;m.classList.add('fly')});
    blast(cx,cy,1);mushroom(cx,cy);cracks(cx,cy);runFX();
    // secondary blasts
    [[350,.5],[700,.45],[1050,.35]].forEach(([ms,p])=>later(ms,()=>{const ox=cx+(Math.random()-.5)*r.width*.8,oy=cy+(Math.random()-.5)*r.height*.6;
      blast(ox,oy,p);FX.cx=ox;FX.cy=oy;FX.glow=.55}));
    // 3. the wreck keeps burning
    later(900,()=>{FX.burn=true;crackle();runFX()});
    later(2600,onDone);
  });
}
function loop(prev){
  raf=requestAnimationFrame(now=>{
    if(G.over)return;
    G.left-=now-prev;
    const sec=Math.ceil(G.left/1000);
    if(sec!==lastTick){lastTick=sec;if(sec<=10)SFX.heart();else beep(1000,.03,'square',.025)}
    drawClock();
    if(G.left<=0){G.left=0;drawClock();end(false,'Time ran out.');return}
    loop(now);
  });
}
function start(){
  audioOn();
  newGame();$('#over').hidden=true;drawTop();lastTick=-1;resetFX();scrollTo(0,0);
  const p=performance.now();loop(p);if(G.active.includes('pulse'))lightPad(G.pulse.lit);SFX.arm();
  G.active.forEach(peek);
  if(G.active.includes('dial'))gl(G.dial.tick,marchDial);
  if(G.active.includes('slider')&&G.sl.move)gl(G.sl.move,moveSlider);
  if(G.decoy&&!G.decoy.revealed)gl(G.decoy.late,()=>{if(G.over)return;G.decoy.revealed=true;drawDecoy();beep(260,.1,'square',.05)});
  if(G.chain)peekChain();
}

/* ---------- wires: cut what the screen says ---------- */
const spark=el=>{el.classList.remove('spark');void el.offsetWidth;el.classList.add('spark');try{ac&&noiseBurst(ac.currentTime,.25,9000,2000,.35,1)}catch(e){}};
$('#wires').onclick=e=>{
  const w=e.target.closest('.wire');if(!w||G.over||G.solved.has('wires')||!allowed('wires'))return;
  const i=+w.dataset.i,Wd=G.w,st=Wd.steps[Wd.step];if(Wd.cut.has(i))return;
  if(st.ans.includes(i)){
    Wd.cut.add(i);w.classList.add('cut');SFX.snip();
    if(G.lvl.shuffle==='all')shuffleEls('#wires .wire');
    if(!st.any&&!st.ans.every(j=>Wd.cut.has(j)))return;   // "CUT ALL …" still has wires left
    Wd.step++;
    if(Wd.step===Wd.steps.length)solve('wires');else{SFX.step();CLUE.wires();peek('wires')}
  }else{spark(w);strike('wires')}
};

/* ---------- button: tap, tap ×N, or hold and let go in the green (which may slide) ---------- */
const big=$('#big');let meterRaf=0;
function down(){
  if(!G||G.over||G.solved.has('button')||G.btn.downAt||!allowed('button'))return;
  const Bt=G.btn;Bt.downAt=performance.now();big.classList.add('down');SFX.thunk();
  if(Bt.kind==='hold'){holdHum(true);let inZ=false;const t0=Bt.downAt;(function m(){const s=(performance.now()-t0)/1000,t=s/Bt.speed;Bt.fill=(1-Math.abs(1-t%2))*100;$('#fill').style.height=Bt.fill+'%';
    if(Bt.slide){const lo=10,hi=90-Bt.size,mid=(lo+hi)/2,amp=(hi-lo)/2,z=mid+amp*Math.sin(Bt.ph+s*6.283/Bt.slide);Bt.cur=[z,z+Bt.size];drawZone()}
    if(hum)hum.o.frequency.value=160+Bt.fill*6;const z=Bt.fill>=Bt.cur[0]&&Bt.fill<=Bt.cur[1];if(z&&!inZ)SFX.click(2400);inZ=z;
    meterRaf=requestAnimationFrame(m)})()}
}
function up(){
  if(!G||!G.btn.downAt)return;
  const Bt=G.btn,dt=performance.now()-Bt.downAt;Bt.downAt=0;big.classList.remove('down');cancelAnimationFrame(meterRaf);holdHum(false);
  if(G.over)return;
  if(Bt.kind==='hold'){const ok=Bt.fill>=Bt.cur[0]&&Bt.fill<=Bt.cur[1];if(!ok){$('#fill').style.height='0%';strike('button')}else solve('button');return}
  if(dt>450){strike('button');return}
  Bt.left--;if(Bt.left<=0)solve('button');else{SFX.click(900+(Bt.n-Bt.left)*200);CLUE.button()}
}
big.addEventListener('pointerdown',e=>{e.preventDefault();big.setPointerCapture?.(e.pointerId);down()});
big.addEventListener('pointerup',up);big.addEventListener('pointercancel',up);
big.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();down()}});
big.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();up()}});
big.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- keypad: press the symbols in the order shown (◀ = reverse) ---------- */
$('#keys').onclick=e=>{
  const k=e.target.closest('.key');if(!k||G.over||G.solved.has('keys')||k.classList.contains('hit')||!allowed('keys'))return;
  if(!G.keysTouched){G.keysTouched=true;peek('keys')}
  const Kd=G.keys,want=Kd.rev?Kd.seq[Kd.seq.length-1-Kd.hits]:Kd.seq[Kd.hits];
  if(k.dataset.s===want){k.classList.add('hit');Kd.hits++;SFX.key(Kd.hits);if(Kd.hits===Kd.seq.length)solve('keys');else{CLUE.keys();if(G.lvl.shuffle==='all')shuffleEls('#keys .key')}}
  else{k.classList.remove('bad');void k.offsetWidth;k.classList.add('bad');strike('keys')}
};

/* ---------- pulse: tap the lit pad, again and again (◀ = tap the opposite pad) ---------- */
// pads sit in a diamond: red top, blue right, green left, yellow bottom
const OPP={red:'yellow',yellow:'red',blue:'green',green:'blue'};
function lightPad(c){document.querySelectorAll('.pad').forEach(p=>{const on=p.dataset.c===c;p.classList.toggle('lit',on);if(on){p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')}})}
const TONE={red:330,blue:440,green:550,yellow:660};
$('#pads').onclick=e=>{
  const p=e.target.closest('.pad'),Pd=G&&G.pulse;if(!p||G.over||G.solved.has('pulse')||!allowed('pulse'))return;
  const want=Pd.rev?OPP[Pd.lit]:Pd.lit;
  if(p.dataset.c===want){
    Pd.hits++;SFX.blip(TONE[p.dataset.c]+Pd.hits*20);
    if(Pd.hits>=Pd.n){lightPad(null);solve('pulse');return}
    Pd.lit=Pd.seq[Pd.hits];lightPad(Pd.lit);CLUE.pulse();
  }else{p.classList.remove('bad');void p.offsetWidth;p.classList.add('bad');strike('pulse')}
};

/* ---------- switches: flip each one to match the arrows (OPPOSITE = the other way) ---------- */
$('#sws').onclick=e=>{
  const s=e.target.closest('.sw2');if(!s||G.over||G.solved.has('switches')||!allowed('switches'))return;
  const Sd=G.sw,i=+s.dataset.i;
  if(Sd.state[i]===Sd.target[i]){s.classList.remove('bad');void s.offsetWidth;s.classList.add('bad');strike('switches');return}
  Sd.state[i]=!Sd.state[i];s.classList.toggle('up',Sd.state[i]);s.setAttribute('aria-label',`Switch ${i+1}, ${Sd.state[i]?'up':'down'}`);SFX.clack(Sd.state[i]);
  if(Sd.state.every((u,j)=>u===Sd.target[j]))solve('switches');
};

/* ---------- dial: the hand marches steadily; press SET when it's on the right number ---------- */
function marchDial(){
  if(!G||G.over||G.solved.has('dial'))return;const Dd=G.dial;
  Dd.val=(Dd.val+Dd.dir+10)%10;Dd.ang+=Dd.dir*36;drawDial();SFX.ratchet(.08);
  gl(Dd.tick,marchDial);
}
$('#m-dial').addEventListener('click',e=>{
  const b=e.target.closest('.dbtn');if(!b||!G||G.over||G.solved.has('dial')||!allowed('dial'))return;
  if(G.dial.val===G.dial.want){SFX.thunk();solve('dial')}else strike('dial');
});

/* ---------- slider: drag to the number and let go ---------- */
let slKbd=false;
function commitSlider(i){
  if(!G||G.over||G.solved.has('slider'))return;
  const s=G.sl.items[i],r=$(`#sliders .rng[data-i="${i}"]`);if(!s||s.done||!r)return;
  const now=performance.now();if(now-s.at<250)return;s.at=now;            // one release counts once
  if(!allowed('slider')){r.value=s.val;r.nextElementSibling.textContent=s.val;return}
  s.val=+r.value;
  if(s.val===s.target){s.done=true;r.disabled=true;SFX.thunk();if(G.sl.items.every(x=>x.done))solve('slider');else CLUE.slider()}
  else strike('slider');
}
const slEl=$('#sliders');
slEl.addEventListener('input',e=>{const r=e.target.closest('.rng');if(!r)return;r.nextElementSibling.textContent=r.value;SFX.ratchet(.06)});
slEl.addEventListener('pointerdown',()=>{slKbd=false});
slEl.addEventListener('pointerup',e=>{const r=e.target.closest('.rng');if(r)commitSlider(+r.dataset.i)});
slEl.addEventListener('change',e=>{const r=e.target.closest('.rng');if(r&&!slKbd)commitSlider(+r.dataset.i)});
slEl.addEventListener('keydown',e=>{const r=e.target.closest('.rng');if(!r)return;slKbd=true;if(e.key==='Enter'){e.preventDefault();commitSlider(+r.dataset.i)}});
function moveSlider(){
  if(!G||G.over||G.solved.has('slider'))return;
  for(const s of G.sl.items)if(!s.done)s.target=s.target===0?1:s.target===9?8:s.target+(Math.random()<.5?-1:1);
  CLUE.slider();beep(1700,.02,'sine',.03);gl(G.sl.move,moveSlider);
}

/* ---------- decoy: a fake module; touching it is a mistake ---------- */
function touchDecoy(e){
  if(!G||G.over||!G.decoy||!playing())return;if(e)e.preventDefault();
  const m=$('#m-decoy');m.classList.remove('zap');void m.offsetWidth;m.classList.add('zap');
  if(!G.decoy.revealed){G.decoy.revealed=true;drawDecoy()}
  try{ac&&noiseBurst(ac.currentTime,.25,9000,2000,.35,1)}catch(err){}
  strike();
}
$('#m-decoy').addEventListener('pointerdown',touchDecoy);
$('#dbig').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')touchDecoy(e)});

/* ---------- chain: modules must be solved in their numbered order ---------- */
// plain chains just lock the others; on blind chains the numbers hide, and touching the wrong module is a mistake
function allowed(id){
  if(!G||!G.chain||G.over||G.chain[G.ci]===id)return true;
  if(G.lvl.chain.blind){const m=$('#m-'+id);m.classList.remove('zap');void m.offsetWidth;m.classList.add('zap');strike();if(!G.over)peekChain()}
  return false;
}
function peekChain(){
  const t=G.chain&&G.lvl.chain.blind;if(!t)return;
  G.chainHid=false;drawChain();clearTimeout(G.cht);
  G.cht=setTimeout(()=>{if(G.over)return;G.chainHid=true;drawChain()},t);GT.push(G.cht);
}

/* ---------- shuffle: modules (and on some levels wires and keys) swap places ---------- */
function shuffleEls(sel){const els=[...document.querySelectorAll(sel)],o=els.map((_,i)=>i).sort(()=>Math.random()-.5);els.forEach((el,i)=>{el.style.order=o[i]})}
function shuffleMods(){
  const ids=[...G.active,...(G.decoy?['decoy']:[])],o=ids.map((_,i)=>i).sort(()=>Math.random()-.5);
  ids.forEach((id,i)=>{const m=$('#m-'+id);m.style.order=o[i];m.classList.remove('shuf');void m.offsetWidth;m.classList.add('shuf')});
  beep(500,.05,'triangle',.05);
}

/* ---------- final lock: unscrew the plate, read the code, type it in ---------- */
function drawEntry(){const d=$('#vdisp');d.className='vdisp';d.textContent=(G.entry+'·'.repeat(G.code.length)).slice(0,G.code.length);d.classList.toggle('long',G.code.length>4)}
function openCover(){
  if(G.over)return;G.stage='final';
  const mods=$('.mods');mods.classList.add('lift');
  try{if(ac){noiseBurst(ac.currentTime,.7,6000,800,.25,1.2);beep(70,.25,'square',.08)}}catch(e){}
  setTimeout(()=>{if(G.stage!=='final')return;mods.hidden=true;$('#m-final').hidden=false;beep(220,.12,'square',.05)},600);
}
function showCode(){
  const c=$('#codeShow'),m=G.lvl.final&&G.lvl.final.memo;c.textContent=G.code;c.classList.remove('gone');
  $('#c-final').textContent=m?'MEMORISE · ENTER CODE':'ENTER THE CODE';
  if(m)gl(m,()=>{c.textContent='?'.repeat(G.code.length);c.classList.add('gone')});
}
function pressPin(k){
  if(!G||G.over||G.stage!=='final'||G.busy)return;
  const d=$('#vdisp'),n=G.code.length;
  if(k==='C'){G.entry='';drawEntry();SFX.click(500);return}
  if(k==='B'){G.entry=G.entry.slice(0,-1);drawEntry();SFX.click(500);return}
  if(k!=='E'){if(G.entry.length<n){G.entry+=k;drawEntry();SFX.click(1200+ +k*60)}return}
  if(G.entry===G.code){
    d.textContent='SAFE';d.className='vdisp ok';$('#m-final').classList.add('done');$('#c-final').textContent=DONE;
    [784,988,1175].forEach((f,i)=>setTimeout(()=>beep(f,.15,'sine',.08),i*100));
    defused();
  }else{
    G.busy=true;d.textContent='ERR';d.className='vdisp err';strike();
    if(G.over)return;
    if(G.screws>=4)showCode();
    setTimeout(()=>{G.busy=false;G.entry='';if(G.stage==='final')drawEntry()},800);
  }
}
$('#pinpad').onclick=e=>{const b=e.target.closest('.pin');if(b)pressPin(b.dataset.k)};
document.addEventListener('keydown',e=>{
  if(!G||G.over||G.stage!=='final'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.closest&&e.target.closest('.pin')&&(e.key==='Enter'||e.key===' '))return;
  if(/^[0-9]$/.test(e.key))pressPin(e.key);else if(e.key==='Enter'){e.preventDefault();pressPin('E')}else if(e.key==='Backspace'){e.preventDefault();pressPin('B')}else if(e.key==='Escape')pressPin('C');
});
$('#plate').onclick=e=>{
  const s=e.target.closest('.screw');if(!s||!G||G.over||G.stage!=='final'||s.classList.contains('out'))return;
  s.classList.add('out');G.screws++;beep(1200,.03,'square',.03);setTimeout(()=>beep(900,.03,'square',.03),120);
  if(G.screws===4)setTimeout(()=>{$('#plate').classList.add('off');try{ac&&noiseBurst(ac.currentTime+.6,.15,3000,600,.4,1)}catch(e){}showCode()},500);
};

/* start: name screen for new players, otherwise the next level's briefing */
if(S.current)lvl=Math.min(prof().unlocked,LEVELS.length-1);
// reloading the page while the leaderboard was open goes straight back to it (Overall tab); read this before any screen is shown
let wasBoard=false;try{wasBoard=sessionStorage.getItem('defusal.screen')==='board'}catch(e){}
preview();showOver(S.current?'brief':'name');submitScore();submitTimes();submitDaily();
if(wasBoard&&S.current&&lbOn()){boardFrom='map';boardLvl=lvl;boardTab='all';showOver('board')}
// mute button
const drawMute=()=>{const b=$('#mute');b.textContent=S.muted?'🔇':'🔊';b.setAttribute('aria-label',S.muted?'Sound off':'Sound on')};
$('#mute').onclick=()=>{S.muted=!S.muted;save();if(master)master.gain.value=S.muted?0:1;else audioOn();drawMute();SFX.click(1400)};drawMute();
}
</script>
